<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convite Sombrio - Halloween</title>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Nosifer&display=swap" rel="stylesheet">
    <style>
        body {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a0d00 0%, #2d1810 25%, #4a1810 50%, #2d1810 75%, #1a0d00 100%);
            font-family: 'Georgia', serif;
            color: #ff6b35;
            overflow-x: hidden;
            position: relative;
        }

        /* Efeito de partículas flutuantes */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #ff6b35, transparent),
                radial-gradient(2px 2px at 40px 70px, #ff8c42, transparent),
                radial-gradient(1px 1px at 90px 40px, #ff6b35, transparent),
                radial-gradient(1px 1px at 130px 80px, #ff8c42, transparent);
            background-repeat: repeat;
            background-size: 200px 100px;
            animation: float 20s linear infinite;
            opacity: 0.3;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); }
            100% { transform: translateY(-100vh) rotate(360deg); }
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 800px;
            margin: 0 auto;
            padding: 1.5rem;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Cabeçalho */
        .header {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .title {
            font-family: 'Nosifer', cursive;
            font-size: clamp(1.5rem, 3.5vw, 2.8rem);
            color: #000;
            text-shadow: 
                0 0 10px #ff6b35,
                0 0 20px #ff6b35,
                0 0 30px #ff6b35,
                2px 2px 4px #ff6b35;
            margin: 0;
            letter-spacing: 2px;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px #ff6b35, 0 0 20px #ff6b35, 0 0 30px #ff6b35, 2px 2px 4px rgba(0,0,0,0.8); }
            to { text-shadow: 0 0 20px #ff6b35, 0 0 30px #ff6b35, 0 0 40px #ff6b35, 2px 2px 4px rgba(0,0,0,0.8); }
        }

        /* Texto do convite */
        .invitation-text {
            background: rgba(0,0,0,0.7);
            border: 2px solid #ff6b35;
            border-radius: 15px;
            padding: 1.5rem;
            margin: 1.5rem 0;
            font-size: clamp(1.1rem, 2.5vw, 1.4rem);
            line-height: 1.6;
            box-shadow: 
                0 0 20px rgba(255, 107, 53, 0.3),
                inset 0 0 20px rgba(255, 107, 53, 0.1);
            position: relative;
        }

        .invitation-text::before {
            content: '🕷️';
            position: absolute;
            top: -10px;
            left: 20px;
            font-size: 2rem;
            animation: swing 3s ease-in-out infinite;
        }

        .invitation-text::after {
            content: '🕷️';
            position: absolute;
            bottom: -10px;
            right: 20px;
            font-size: 2rem;
            animation: swing 3s ease-in-out infinite reverse;
        }

        @keyframes swing {
            0%, 100% { transform: rotate(-10deg); }
            50% { transform: rotate(10deg); }
        }

        .emoji-line {
            font-size: 2rem;
            margin: 1rem 0;
            letter-spacing: 1rem;
        }

        /* Botão principal */
        .cta-container {
            margin: 2rem 0;
            position: relative;
        }

        .cta-button {
            display: inline-block;
            background: linear-gradient(45deg, #ff6b35, #ff8c42, #ff6b35);
            background-size: 200% 200%;
            color: #000;
            font-family: 'Nosifer', cursive;
            font-size: clamp(1.2rem, 3vw, 1.6rem);
            font-weight: bold;
            text-decoration: none;
            padding: 1.5rem 3rem;
            border-radius: 50px;
            border: 3px solid #ff6b35;
            box-shadow: 
                0 0 30px rgba(255, 107, 53, 0.6),
                inset 0 0 20px rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            animation: backgroundShift 3s ease infinite;
        }

        @keyframes backgroundShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .cta-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.5s;
        }

        .cta-button:hover {
            transform: scale(1.05);
            box-shadow: 
                0 0 50px rgba(255, 107, 53, 0.8),
                inset 0 0 30px rgba(255, 255, 255, 0.3);
            animation: pulse 0.5s ease infinite alternate, backgroundShift 1s ease infinite;
        }

        .cta-button:hover::before {
            left: 100%;
        }



        @keyframes pulse {
            from { box-shadow: 0 0 50px rgba(255, 107, 53, 0.8), inset 0 0 30px rgba(255, 255, 255, 0.3); }
            to { box-shadow: 0 0 70px rgba(255, 107, 53, 1), inset 0 0 40px rgba(255, 255, 255, 0.4); }
        }

        @keyframes webAppear {
            from { opacity: 0; transform: translateX(-50%) scale(0); }
            to { opacity: 1; transform: translateX(-50%) scale(1); }
        }

        /* Decorações extras */
        .decoration {
            position: absolute;
            font-size: 3rem;
            opacity: 0.6;
            animation: float-decoration 6s ease-in-out infinite;
        }

        .decoration:nth-child(1) {
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .decoration:nth-child(2) {
            top: 20%;
            right: 10%;
            animation-delay: 2s;
        }

        .decoration:nth-child(3) {
            bottom: 20%;
            left: 15%;
            animation-delay: 4s;
        }

        .decoration:nth-child(4) {
            bottom: 10%;
            right: 15%;
            animation-delay: 1s;
        }

        @keyframes float-decoration {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        /* Pop-up styles */
        .popup-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .popup-content {
            background: linear-gradient(135deg, #1a0d00, #2d1810);
            border: 3px solid #ff6b35;
            border-radius: 20px;
            padding: 2rem;
            max-width: 400px;
            text-align: center;
            position: relative;
            box-shadow: 0 0 50px rgba(255, 107, 53, 0.6);
            animation: popupAppear 0.3s ease;
        }

        @keyframes popupAppear {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .popup-content p {
            font-size: 1.3rem;
            color: #ff6b35;
            margin: 0;
            font-weight: bold;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 2rem;
            color: #ff6b35;
            cursor: pointer;
            font-weight: bold;
        }

        .close-btn:hover {
            color: #ff8c42;
        }

        /* Responsividade */
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            
            .invitation-text {
                padding: 1.5rem;
                margin: 1.5rem 0;
            }
            
            .cta-button {
                padding: 1.2rem 2rem;
                margin: 0.5rem !important;
            }
            
            .decoration {
                font-size: 2rem;
            }

            .cta-container {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 1rem;
            }

            .popup-content {
                margin: 1rem;
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="decoration">🎃</div>
    <div class="decoration">👻</div>
    <div class="decoration">🦇</div>
    <div class="decoration">🕸️</div>

    <div class="container">
        <header class="header">
            <h1 class="title">Olá, Amanda Gomes</h1>
        </header>

        <div class="invitation-text">
            <p>Doces, travessuras ou um date comigo na noite de Halloween?</p>
        </div>

        <div class="cta-container">
            <a href="https://calendar.app.google/oM4nRYxT7gRErqTm7" target="_blank" rel="noopener noreferrer" class="cta-button">
                Aceito o Convite
            </a>
            <button onclick="showPopup()" class="cta-button" style="margin-left: 1rem;">
                Doces ou Travessuras
            </button>
        </div>

        <!-- Pop-up -->
        <div id="popup" class="popup-overlay" onclick="closePopup()">
            <div class="popup-content" onclick="event.stopPropagation()">
                <span class="close-btn" onclick="closePopup()">&times;</span>
                <p>Tá de sacanagem? Aceita logo o convite! 😈</p>
            </div>
        </div>
    </div>

    <script>
        function showPopup() {
            document.getElementById('popup').style.display = 'flex';
        }

        function closePopup() {
            document.getElementById('popup').style.display = 'none';
        }

        // Fechar popup com ESC
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closePopup();
            }
        });
    </script>

</html>
